version: "3.9"
services:
  frontend:
    build: .
    container_name: my-portfolio-frontend
    command: npm run dev -- --host 0.0.0.0
    ports:
      - "5173:5173"
    volumes:
      - .:/app
      - /app/node_modules   # prevent overwriting node_modules with host
    stdin_open: true
    tty: true
