version: "3.9"

services:
  frontend:
    build: .
    container_name: portfolio-frontend
    command: npm run dev -- --host 0.0.0.0
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=${BACKEND_URL}
    depends_on:
      - backend
    restart: always

  backend:
    build: ./backend
    container_name: portfolio-backend
    ports:
      - "5000:5000"
    environment:
      - MONGO_URL=${MONGO_URL}
      - PORT=5000
    depends_on:
      - mongo
    restart: always

  mongo:
    image: mongo:latest
    container_name: portfolio-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    restart: always

volumes:
  mongo-data:
