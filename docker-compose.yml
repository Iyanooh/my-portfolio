version: "3.9"

services:
  frontend:
    build: .
    container_name: portfolio-frontend
    command: npm run dev -- --host 0.0.0.0
    ports:
      - "5173:5173"
    environment:
      # CRITICAL FOR LOCAL: Use the Docker service name 'backend' and its internal port 5000
      # For Railway deployment, you will still need to use the public BACKEND_URL variable.
      - VITE_API_URL=http://backend:5000
    depends_on:
      - backend
    restart: always

  backend:
    # --- START OF FIX ---
    # Set the build context to the root directory (.) so it can find server.js
    build: 
      context: ./backend
      # Explicitly specify the Dockerfile path since the context is now the root
      dockerfile: backend/Dockerfile
    # --- END OF FIX ---
    container_name: portfolio-backend
    ports:
      - "5000:5000"
    environment:
      # For local Docker, this should ideally be: mongodb://mongo:27017/mydatabase
      - MONGO_URL=${MONGO_URL} 
      - PORT=5000
    depends_on:
      - mongo
    restart: always

  mongo:
    image: mongo:latest
    container_name: portfolio-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    restart: always

volumes:
  mongo-data:
